# 交付包占位配置 — 客户部署由 cizhenyu_deploy 注入真实值
# 本文件不会用于生产；切勿把真实 wrangler.toml 打进交付包。

name = "cizhenyu-CHANGE_ME"
main = "worker/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "cizhenyu-d1-db"
database_id = "REPLACE_AT_DEPLOY"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "cizhenyu-r2-media"

[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "REPLACE_AT_DEPLOY"

[[kv_namespaces]]
binding = "NS_CONFIG"
id = "REPLACE_AT_DEPLOY"

[[kv_namespaces]]
binding = "SESSION"
id = "REPLACE_AT_DEPLOY"

[vars]
ENVIRONMENT = "production"
WORKER_NAME = "cizhenyu-CHANGE_ME"
CF_ZONE_NAME = ""
DEFAULT_ADMIN_USER = "admin"
DEFAULT_ADMIN_PASSWORD = "CHANGE_ME"
ADMIN_VERIFICATION = "CHANGE_ME"
TURNSTILE_ADMIN_SITE_KEY = "CHANGE_ME"
